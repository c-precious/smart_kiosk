<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payments - Smart Kiosk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page-container">

    <header class="top-header">
        <h1>Smart Kiosk</h1>
        <div class="header-right">
            <p id="paymentsDate"></p>
        </div>
    </header>

    <section class="welcome-section">
        <h2 id="paymentsShopName">Payments</h2>
        <p>View all completed service payments</p>
    </section>

    <section class="customers-main-card">

        <div class="customers-header-row">
            <h3>Payment Records</h3>
            <input type="text" id="paymentSearch" placeholder="Search payment...">
        </div>

        <div class="payments-table-header">
            <div>Customer</div>
            <div>Service</div>
            <div>Amount</div>
            <div>Method</div>
            <div>Date</div>
        </div>

        <div class="customers-scroll-box">
            <div id="paymentsList"></div>
        </div>

    </section>

</div>

<div class="bottom-back">
    <a href="/service-shop-page">← Back</a>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
