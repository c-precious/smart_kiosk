<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Schedule - Smart Kiosk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page-container">

    <header class="top-header">
        <h1>Smart Kiosk</h1>
        <div class="header-right">
            <p id="scheduleDate"></p>
        </div>
    </header>

    <section class="welcome-section">
        <h2 id="scheduleShopName">Schedule</h2>
        <p>Record services and manage payments</p>
    </section>

    <section class="customers-main-card">

        <div class="customers-header-row">
            <h3>Service Schedule</h3>
            <input type="text" id="scheduleSearch" placeholder="Search customer/service...">
        </div>

        <div class="schedule-table-header">
            <div>Customer</div>
            <div>Service</div>
            <div>Date</div>
            <div>Time</div>
            <div>Price</div>
            <div>Payment</div>
        </div>

        <div class="customers-scroll-box">
            <div id="scheduleList"></div>
        </div>

        <button id="showAddScheduleBtn" class="add-product-small-btn">
            + Add Schedule
        </button>

    </section>

</div>

<!-- Add Schedule Popup -->
<div id="addSchedulePopup" class="popup hidden">
    <div class="popup-content">
        <h3>Add Schedule</h3>

        <input type="text" id="scheduleCustomerName" placeholder="Customer Name">
        <input type="text" id="scheduleServiceName" placeholder="Service Offered">
        <input type="date" id="scheduleAppointmentDate">
        <input type="time" id="scheduleAppointmentTime">
        <input type="number" id="schedulePrice" placeholder="Price">

        <button id="saveScheduleBtn">Save Schedule</button>
        <button id="closeSchedulePopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<!-- Choose Payment Popup -->
<div id="choosePaymentPopup" class="popup hidden">
    <div class="popup-content">
        <h3>Choose Payment</h3>

        <input type="hidden" id="paymentScheduleId">
        <input type="hidden" id="paymentServiceName">
        <input type="hidden" id="paymentCustomerName">
        <input type="hidden" id="paymentAmount">

        <button id="chooseCashBtn" class="cash-choice-btn">Cash</button>
        <button id="chooseMpesaBtn" class="mpesa-choice-btn">M-PESA</button>
        <button id="chooseDebtBtn" class="debt-choice-btn">Debt</button>

        <button id="closeChoosePaymentPopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<!-- M-PESA Popup -->
<div id="mpesaPaymentPopup" class="popup hidden">
    <div class="popup-content">
        <h3>M-PESA Payment</h3>

        <input type="text" id="mpesaPhoneNumber" placeholder="Customer Phone Number">

        <button id="confirmMpesaPaymentBtn">Record M-PESA Payment</button>
        <button id="closeMpesaPopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<!-- Debt Popup -->
<div id="debtPaymentPopup" class="popup hidden">
    <div class="popup-content">
        <h3>Record Debt</h3>

        <input type="date" id="serviceDebtDueDate">

        <button id="confirmDebtBtn">Save Debt</button>
        <button id="closeDebtPopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<div class="bottom-back">
    <a href="/service-shop-page">← Back</a>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
