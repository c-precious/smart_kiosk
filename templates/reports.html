<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Analysis - Smart Kiosk</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="page-container">

    <header class="top-header">
        <h1>Smart Kiosk</h1>
        <div class="header-right">
            <p id="analysisDate"></p>
        </div>
    </header>

    <section class="welcome-section">
        <h2 id="analysisShopName">Analysis</h2>
        <p>Understand your business performance</p>
    </section>

    <section class="analysis-summary">

        <div class="summary-card">
            <h3 id="summaryOneTitle">Total Records</h3>
            <p id="totalSales">0</p>
        </div>

        <div class="summary-card">
            <h3>Total Revenue</h3>
            <p id="totalRevenue">Ksh 0</p>
        </div>

        <div class="summary-card">
            <h3 id="summaryThreeTitle">Average Sale</h3>
            <p id="averageSale">Ksh 0</p>
        </div>

    </section>

    <section class="analysis-card">

        <div class="analysis-chart-header">
            <h3 id="chartTitle">Trend</h3>

            <div class="chart-buttons">
                <button class="chart-btn active-chart-btn" id="salesTrendBtn">Trend</button>
                <button class="chart-btn" id="paymentMethodBtn">Payment Method</button>
                <button class="chart-btn" id="topProductsBtn">Top Items</button>
            </div>
        </div>

        <div class="chart-box">
            <canvas id="analysisChart"></canvas>
        </div>

    </section>

    <section class="analysis-card">
        <h3>Business Insight</h3>
        <p id="predictionText">Loading...</p>
    </section>

</div>

<div class="bottom-back">
    <a id="analysisBackLink" href="/shop-page">← Back</a>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
