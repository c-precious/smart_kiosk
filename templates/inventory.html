<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock - Smart Kiosk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page-container">

    <header class="top-header">
        <h1>Smart Kiosk</h1>
        <div class="header-right">
            <p id="stockDate"></p>
        </div>
    </header>

    <section class="welcome-section">
        <h2 id="stockShopName">Stock</h2>
        <p>View, search and manage products in this shop</p>
    </section>

    <section class="stock-main-card">

        <div class="stock-header-row">
            <h3>Current Stock</h3>
            <input type="text" id="stockSearch" placeholder="Search product...">
        </div>

        <div class="stock-table-header">
            <div>Product</div>
            <div>Category</div>
            <div>Price</div>
            <div>Quantity</div>
            <div>Action</div>
        </div>

        <div id="stockList"></div>

        <button id="showAddProductBtn" class="add-product-small-btn">+ Add Product</button>

    </section>

</div>

<div id="addProductPopup" class="popup hidden">
    <div class="popup-content">
        <h3 id="productPopupTitle">Add Product</h3>

        <input type="hidden" id="editProductId">
        <input type="hidden" id="editInventoryId">

        <input type="text" id="productName" placeholder="Product Name">
        <input type="text" id="productCategory" placeholder="Category">
        <input type="number" id="productPrice" placeholder="Price">
        <input type="number" id="productQuantity" placeholder="Quantity">

        <button id="addProductBtn">Save Product</button>
        <button id="closeProductPopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<div class="bottom-back">
    <a href="/shop-page">← Back</a>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
