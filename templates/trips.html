<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Trips - Smart Kiosk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="page-container">

    <header class="top-header">
        <h1>Smart Kiosk</h1>
        <div class="header-right">
            <p id="tripsDate"></p>
        </div>
    </header>

    <section class="welcome-section">
        <h2 id="tripsShopName">Trips</h2>
        <p>Record bodaboda trips and manage payments</p>
    </section>

    <section class="customers-main-card">

        <div class="customers-header-row">
            <h3>Trip Records</h3>
            <input type="text" id="tripSearch" placeholder="Search trip...">
        </div>

        <div class="trips-table-header">
            <div>Customer</div>
            <div>Destination</div>
            <div>Distance</div>
            <div>Price</div>
            <div>Payment</div>
        </div>

        <div class="customers-scroll-box">
            <div id="tripsList"></div>
        </div>

        <button id="showAddTripBtn" class="add-product-small-btn">
            + Add Trip
        </button>

    </section>

</div>

<!-- Add Trip Popup -->
<div id="addTripPopup" class="popup hidden">
    <div class="popup-content">
        <h3>Add Trip</h3>

        <input type="text" id="tripCustomerName" placeholder="Customer Name">
        <input type="text" id="tripCustomerPhone" placeholder="Customer Phone">
        <input type="text" id="tripDestination" placeholder="Destination">

        <input type="number" id="tripDistance" placeholder="Distance in KM">
        <input type="number" id="tripRate" placeholder="Rate per KM">

        <button id="saveTripBtn">Save Trip</button>
        <button id="closeTripPopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<!-- Choose Trip Payment Popup -->
<div id="chooseTripPaymentPopup" class="popup hidden">
    <div class="popup-content">
        <h3>Choose Payment</h3>

        <input type="hidden" id="tripPaymentId">
        <input type="hidden" id="tripPaymentCustomerName">
        <input type="hidden" id="tripPaymentAmount">

        <button id="chooseTripCashBtn" class="cash-choice-btn">Cash</button>
        <button id="chooseTripMpesaBtn" class="mpesa-choice-btn">M-PESA</button>
        <button id="chooseTripDebtBtn" class="debt-choice-btn">Debt</button>

        <button id="closeTripPaymentPopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<!-- M-PESA Trip Popup -->
<div id="tripMpesaPopup" class="popup hidden">
    <div class="popup-content">
        <h3>M-PESA Payment</h3>

        <input type="text" id="tripMpesaPhoneNumber" placeholder="Customer Phone Number">

        <button id="confirmTripMpesaBtn">Record M-PESA Payment</button>
        <button id="closeTripMpesaPopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<!-- Trip Debt Popup -->
<div id="tripDebtPopup" class="popup hidden">
    <div class="popup-content">
        <h3>Record Debt</h3>

        <input type="date" id="tripDebtDueDate">

        <button id="confirmTripDebtBtn">Save Debt</button>
        <button id="closeTripDebtPopupBtn" class="secondary-btn">Cancel</button>
    </div>
</div>

<div class="bottom-back">
    <a href="/service-shop-page">← Back</a>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
